python-interpreter-path = "../backend/.venv/Scripts/python.exe"
search-path = [
    ".",
    "app",
    "../backend",
    "../backend/app",
    "../backend/.venv/Lib/site-packages"
]
site-package-path = [
    "../backend/.venv/Lib/site-packages",
    "C:/Users/Welcome/AppData/Local/Programs/Python/Python312/Lib/site-packages"
]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv"
]
disable-type-errors-in-ide = true
permissive-ignores = true
enabled-ignores = [
    "type",
    "pyrefly",
    "pyright",
    "mypy",
    "ty",
    "pyre",
    "zuban"
]
type-ignore-unknown-tag-behavior = "suppress"

[errors]
missing-import = "ignore"
